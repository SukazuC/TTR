name: release-build
on:
  workflow_dispatch:
jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B out -A x64 -DTTR_WARNINGS_AS_ERRORS=ON
      - run: cmake --build out --config Release --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-release
          path: out/Release/TaskbarThumbnailReorder.exe
